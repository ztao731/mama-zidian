<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>字源识字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#fdf5e6,#fce4d6);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:32px;color:#c0392b;margin-bottom:4px;font-family:'KaiTi','STKaiti',serif}
.sub{color:#8b7355;font-size:15px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:380px;width:100%}
.card{background:#fff;border-radius:14px;padding:20px 16px;text-align:center;text-decoration:none;color:#5c4033;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
.card:active{transform:scale(.97);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card .num{font-size:28px;font-weight:bold;color:#c0392b;margin-bottom:4px}
.card .title{font-size:15px;font-weight:bold;margin-bottom:6px}
.card .chars{font-size:13px;color:#8b7355}
.card.locked{opacity:.45;pointer-events:none}
.card.locked .num{color:#999}
</style>
</head>
<body>

<h1>字源识字</h1>
<p class="sub">50个基础汉字 · 10关循序渐进</p>

<div class="grid">
  <a class="card" href="level1.html">
    <div class="num">①</div>
    <div class="title">象形字入门</div>
    <div class="chars">日 月 山 水 火 人 目 口 手</div>
  </a>
  <a class="card" href="level2.html">
    <div class="num">②</div>
    <div class="title">象形字——动物</div>
    <div class="chars">马 牛 羊 鱼 鸟</div>
  </a>
  <div class="card locked">
    <div class="num">③</div>
    <div class="title">第3关</div>
    <div class="chars">敬请期待</div>
  </div>
  <div class="card locked">
    <div class="num">④</div>
    <div class="title">第4关</div>
    <div class="chars">敬请期待</div>
  </div>
  <div class="card locked">
    <div class="num">⑤</div>
    <div class="title">第5关</div>
    <div class="chars">敬请期待</div>
  </div>
  <div class="card locked">
    <div class="num">⑥</div>
    <div class="title">第6关</div>
    <div class="chars">敬请期待</div>
  </div>
  <div class="card locked">
    <div class="num">⑦</div>
    <div class="title">第7关</div>
    <div class="chars">敬请期待</div>
  </div>
  <div class="card locked">
    <div class="num">⑧</div>
    <div class="title">第8关</div>
    <div class="chars">敬请期待</div>
  </div>
  <div class="card locked">
    <div class="num">⑨</div>
    <div class="title">第9关</div>
    <div class="chars">敬请期待</div>
  </div>
  <div class="card locked">
    <div class="num">⑩</div>
    <div class="title">第10关</div>
    <div class="chars">敬请期待</div>
  </div>
</div>

</body>
</html>
